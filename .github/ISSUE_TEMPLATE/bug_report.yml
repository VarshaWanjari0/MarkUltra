name: Bug Report
description: File a bug report to help improve MarkUltra
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please test against `markdown_viewer_stress_test_extended.md` if relevant.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android & WebView Version
      placeholder: e.g. Android 13, System WebView 115.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or Markdown snippet to reproduce the issue.
    validations:
      required: true
