name: Build & Publish Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Locate and Verify Release APK
        id: locate_apk
        run: |
          ls -la app/build/outputs/apk/release/
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in release output directory!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" app-release.apk
          ls -lh app-release.apk

      - name: Create or Update GitHub Release v1.7.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.7.5 app-release.apk             --title "MarkUltra v1.7.5"             --notes "Official release of MarkUltra v1.7.5 for Android. Bundles 100% offline KaTeX, Mermaid 10, Graphviz, PlantUML, and Vega."             --clobber
